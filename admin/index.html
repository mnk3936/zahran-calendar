  <!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Admin · Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>.row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.login{max-width:380px;margin:60px auto}@media(max-width:640px){.row{grid-template-columns:1fr auto}.row .d{grid-column:1/-1}.two{grid-template-columns:1fr}}</style>
</head><body><div class="wrap" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/config.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let clients=[],cur=null,posts=[];
const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
async function boot(){const {data:{session}}=await sb.auth.getSession();session?await home():loginView()}
function loginView(msg=""){
 app.innerHTML=`<div class="panel login"><h2>Team login</h2><p class="muted">Content calendar admin</p><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><p class="msg" id="msg">${esc(msg)}</p><div class="bar"><button class="pri" id="in">Log in</button><button id="up">Create account</button></div><p class="muted">The first account created becomes the admin. Later accounts need an admin's approval.</p></div>`;
 const go=async fn=>{$("msg").textContent="";const {error}=await fn($("em").value,$("pw").value);error?$("msg").textContent=error.message:boot()};
 $("in").onclick=()=>go((email,password)=>sb.auth.signInWithPassword({email,password}));
 $("up").onclick=()=>go((email,password)=>sb.auth.signUp({email,password}));
}
const out=async()=>{await sb.auth.signOut();loginView()};
async function home(){
 const {data:tm}=await sb.from("team_members").select("user_id");
 if(!(tm&&tm.length)){app.innerHTML=`<div class="panel login"><h2>Waiting for access</h2><p class="muted">You're signed in, but an admin hasn't added you to the team yet.</p><button id="out">Log out</button></div>`;$("out").onclick=out;return}
 const {data}=await sb.from("clients").select("*").order("name");clients=data||[];
 cur=clients.find(c=>c.id===cur?.id)||clients[0]||null;shell();if(cur)await loadPosts()
}
function shell(){
 app.innerHTML=`<header><div><h1>Calendar admin</h1><p>Manage clients and posts</p></div><button id="out">Log out</button></header>
 <div class="bar"><select id="cs" style="max-width:280px" aria-label="Client">${clients.map(c=>`<option value="${c.id}" ${c.id===cur?.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><button id="addc">+ New client</button>${cur?`<button id="editc">Edit client</button><a class="muted" target="_blank" rel="noopener" href="https://${esc(cur.slug)}.thynkculture.com">Open calendar</a>`:""}<span class="sp"></span>${cur?`<button class="pri" id="addp">+ Add post</button>`:""}</div>
 <div id="form"></div><div class="panel" id="list"><p class="muted">${cur?"Loading posts…":"No clients yet. Create one to start."}</p></div>`;
 $("out").onclick=out;$("addc").onclick=()=>clientForm(null);
 if(cur){$("cs").onchange=async e=>{cur=clients.find(c=>c.id===e.target.value);shell();await loadPosts()};$("editc").onclick=()=>clientForm(cur);$("addp").onclick=()=>postForm({})}
}
async function loadPosts(){const {data}=await sb.from("posts").select("*").eq("client_id",cur.id).order("post_date");posts=data||[];renderList()}
function renderList(){
 $("list").innerHTML=posts.length?posts.map(p=>`<div class="row"><b class="d">${p.post_date}</b><div><b>${esc(p.type)}</b> · ${esc(p.pillar)}<div class="muted">${esc(p.content)} · ${p.status}</div></div><div><button data-e="${p.id}">Edit</button> <button class="danger" data-x="${p.id}">Delete</button></div></div>`).join(""):`<p class="muted">No posts yet. Click “Add post”.</p>`;
 $("list").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>postForm(posts.find(p=>p.id===b.dataset.e)));
 $("list").querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this post?"))return;await sb.from("posts").delete().eq("id",b.dataset.x);loadPosts()})}
function clientForm(c){
 $("form").innerHTML=`<div class="panel"><h2>${c?"Edit client":"New client"}</h2><div class="two"><div><label>Name</label><input id="cn" value="${esc(c?.name)}"></div><div><label>Slug (subdomain)</label><input id="cg" value="${esc(c?.slug)}" placeholder="zahran"></div></div><label>Brand colour</label><input id="cc" type="color" value="${c?.accent_color||"#D97757"}" style="max-width:90px;padding:3px"><p class="msg" id="msg"></p><div class="bar"><button class="pri" id="sv">Save client</button><button id="cx">Cancel</button></div></div>`;
 $("cx").onclick=()=>$("form").innerHTML="";
 $("sv").onclick=async()=>{const name=$("cn").value.trim(),slug=slugify($("cg").value||name);if(!name||!slug){$("msg").textContent="Enter a name.";return}
  const row={name,slug,accent_color:$("cc").value};
  const {data,error}=c?await sb.from("clients").update(row).eq("id",c.id).select().single():await sb.from("clients").insert(row).select().single();
  if(error){$("msg").textContent=error.message;return}cur=data;await home()}}
function postForm(p){
 const o=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
 $("form").innerHTML=`<div class="panel"><h2>${p.id?"Edit post":"New post"}</h2><div class="two"><div><label>Date</label><input id="pd" type="date" value="${p.post_date||""}"></div><div><label>Type</label><select id="pt">${o(["Poster","Reel"],p.type)}</select></div></div>
 <div class="two"><div><label>Content pillar</label><input id="pp" value="${esc(p.pillar)}" placeholder="Menu, Collab, Film Dialogues…"></div><div><label>Status</label><select id="ps">${o(["planned","designed","ready","posted"],p.status||"planned")}</select></div></div>
 <label>Content</label><textarea id="pc" rows="2">${esc(p.content)}</textarea><label>Instagram reference link</label><input id="pl" value="${esc(p.ref_link)}" placeholder="https://www.instagram.com/p/…">
 <label>Final post image</label><input id="pi" type="file" accept="image/*">${p.image_url?`<p class="muted">The current image is kept unless you choose a new one.</p>`:""}
 <p class="msg" id="msg"></p><div class="bar"><button class="pri" id="sv">Save post</button><button id="cx">Cancel</button></div></div>`;
 $("cx").onclick=()=>$("form").innerHTML="";
 $("sv").onclick=async()=>{const date=$("pd").value;if(!date){$("msg").textContent="Pick a date.";return}
  let image_url=p.image_url||null;const f=$("pi").files[0];
  if(f){const path=`${cur.slug}/${date}-${Date.now()}.${f.name.split(".").pop()}`;const {error}=await sb.storage.from("post-images").upload(path,f);if(error){$("msg").textContent=error.message;return}image_url=sb.storage.from("post-images").getPublicUrl(path).data.publicUrl}
  const row={client_id:cur.id,post_date:date,type:$("pt").value,pillar:$("pp").value.trim(),content:$("pc").value.trim(),ref_link:$("pl").value.trim()||null,status:$("ps").value,image_url,updated_at:new Date().toISOString()};
  const {error}=p.id?await sb.from("posts").update(row).eq("id",p.id):await sb.from("posts").insert(row);
  if(error){$("msg").textContent=error.message;return}$("form").innerHTML="";loadPosts()}}
boot();
</script></body></html>
